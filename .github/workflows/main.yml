name: brick-remote

on:
  # Branches are checked through their pull request, master on push (and deployed)
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn prettier --check src e2e
      - run: yarn vitest run
      - run: yarn playwright install --with-deps chromium
      - run: yarn e2e

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/

  deploy:
    # Only master is deployed; branches and pull requests are just checked
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ractive.ch
          username: ractive
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: build/
          server-dir: /subdomains/brick-remote/httpdocs/
